# CI/CD for the jiraetlpipeline Cloud Run service.
# Triggered on every push to main: build the Dockerfile image, push it to
# Artifact Registry, then roll it out to Cloud Run. Deploying with --image only
# swaps the code; env vars, scaling and other service settings are kept.
substitutions:
  _SERVICE: jiraetlpipeline
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/jiraetlpipeline

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "-t", "${_IMAGE}:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      # 'warning' so data-quality alerts (coverage drops, field shape changes) reach Slack
      - --update-env-vars=SLACK_NOTIFICATION_LEVEL=warning
      - --quiet

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
